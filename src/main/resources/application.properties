# ===============================
# CONFIGURAZIONE LOCALE
# ===============================
# Demo locale: abilita il DataSeeder e usa il database MySQL locale.
# ===============================================================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===============================
# CONFIGURAZIONE APP
# ===============================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
app.demo-data.enabled=${ENABLE_DEMO_DATA:true}



# ===============================
# CONNESSIONE AL DATABASE MYSQL
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartmall?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
# La password viene letta dalle variabili d'ambiente
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURAZIONE JPA / HIBERNATE
# ===============================
# Aggiornamento delle tabelle automatico
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}

# Mostra le query SQL nella console
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# CONFIGURAZIONE FIREBASE
# ===============================
firebase.project-id=${FIREBASE_PROJECT_ID}
firebase.service-account-json=${FIREBASE_SERVICE_ACCOUNT_JSON:}

# ===============================
# HEALTH CHECK
# ===============================
management.endpoints.web.exposure.include=health
