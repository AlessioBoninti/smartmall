name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to the configured Kubernetes cluster
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: "17"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw test

      - name: Build jar
        run: ./mvnw -DskipTests package

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ""
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name != 'pull_request'
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image names
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          backend_image="${REGISTRY}/${repository}-backend:${GITHUB_SHA}"
          frontend_image="${REGISTRY}/${repository}-frontend:${GITHUB_SHA}"
          backend_latest="${REGISTRY}/${repository}-backend:latest"
          frontend_latest="${REGISTRY}/${repository}-frontend:latest"

          echo "backend_image=${backend_image}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${frontend_image}" >> "$GITHUB_OUTPUT"
          echo "backend_latest=${backend_latest}" >> "$GITHUB_OUTPUT"
          echo "frontend_latest=${frontend_latest}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.images.outputs.backend_image }}
            ${{ steps.images.outputs.backend_latest }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=
            VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
          tags: |
            ${{ steps.images.outputs.frontend_image }}
            ${{ steps.images.outputs.frontend_latest }}

  deploy:
    name: Kubernetes deploy
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'workflow_dispatch' && inputs.deploy == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate deploy configuration
        shell: bash
        run: |
          missing=0

          for name in KUBE_CONFIG_DATA DB_PASSWORD FIREBASE_SERVICE_ACCOUNT_JSON FIREBASE_PROJECT_ID VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required deploy value: ${name}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      - name: Configure kubeconfig
        shell: bash
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Render Kubernetes manifest
        shell: bash
        run: |
          cp k8s/smartmall.yaml /tmp/smartmall.yaml
          sed -i "s|image: smartmall-backend:latest|image: ${BACKEND_IMAGE}|g" /tmp/smartmall.yaml
          sed -i "s|image: smartmall-frontend:latest|image: ${FRONTEND_IMAGE}|g" /tmp/smartmall.yaml
          awk 'BEGIN { RS="---"; ORS="---" } $0 !~ /kind:[[:space:]]*ConfigMap/ && $0 !~ /kind:[[:space:]]*Secret/ { print $0 }' /tmp/smartmall.yaml > /tmp/smartmall-workloads.yaml
        env:
          BACKEND_IMAGE: ${{ needs.docker.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.docker.outputs.frontend_image }}

      - name: Ensure namespace
        run: kubectl create namespace smartmall --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply runtime configuration
        shell: bash
        run: |
          DB_URL="${DB_URL:-jdbc:mysql://mysql:3306/smartmall?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}"
          DB_USERNAME="${DB_USERNAME:-root}"
          HIBERNATE_DDL_AUTO="${HIBERNATE_DDL_AUTO:-update}"
          SPRING_JPA_SHOW_SQL="${SPRING_JPA_SHOW_SQL:-false}"
          SPRING_PROFILES_ACTIVE="${SPRING_PROFILES_ACTIVE:-dev}"
          FIREBASE_PROJECT_ID="${FIREBASE_PROJECT_ID:-your-project-id}"
          CORS_ALLOWED_ORIGINS="${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173}"
          ENABLE_DEMO_DATA="${ENABLE_DEMO_DATA:-true}"

          kubectl -n smartmall create configmap smartmall-config \
            --from-literal=DB_URL="$DB_URL" \
            --from-literal=DB_USERNAME="$DB_USERNAME" \
            --from-literal=HIBERNATE_DDL_AUTO="$HIBERNATE_DDL_AUTO" \
            --from-literal=SPRING_JPA_SHOW_SQL="$SPRING_JPA_SHOW_SQL" \
            --from-literal=SPRING_PROFILES_ACTIVE="$SPRING_PROFILES_ACTIVE" \
            --from-literal=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID" \
            --from-literal=CORS_ALLOWED_ORIGINS="$CORS_ALLOWED_ORIGINS" \
            --from-literal=ENABLE_DEMO_DATA="$ENABLE_DEMO_DATA" \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n smartmall create secret generic smartmall-secret \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=FIREBASE_SERVICE_ACCOUNT_JSON="$FIREBASE_SERVICE_ACCOUNT_JSON" \
            --dry-run=client -o yaml | kubectl apply -f -
        env:
          DB_URL: ${{ vars.DB_URL }}
          DB_USERNAME: ${{ vars.DB_USERNAME }}
          HIBERNATE_DDL_AUTO: ${{ vars.HIBERNATE_DDL_AUTO }}
          SPRING_JPA_SHOW_SQL: ${{ vars.SPRING_JPA_SHOW_SQL }}
          SPRING_PROFILES_ACTIVE: ${{ vars.SPRING_PROFILES_ACTIVE }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
          ENABLE_DEMO_DATA: ${{ vars.ENABLE_DEMO_DATA }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Configure private registry pull secret
        shell: bash
        run: |
          if [ -n "$GHCR_PULL_TOKEN" ]; then
            GHCR_PULL_USERNAME="${GHCR_PULL_USERNAME:-$GITHUB_ACTOR}"
            echo "GHCR_PULL_TOKEN is configured: creating image pull secret for private GHCR images."

            kubectl -n smartmall create secret docker-registry ghcr-auth \
              --docker-server=ghcr.io \
              --docker-username="$GHCR_PULL_USERNAME" \
              --docker-password="$GHCR_PULL_TOKEN" \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl -n smartmall patch serviceaccount default \
              -p '{"imagePullSecrets":[{"name":"ghcr-auth"}]}'
          else
            echo "GHCR_PULL_TOKEN is not configured. This is OK only if the GHCR images are public."
          fi
        env:
          GHCR_PULL_USERNAME: ${{ vars.GHCR_PULL_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}

      - name: Apply Kubernetes workloads
        run: kubectl apply -f /tmp/smartmall-workloads.yaml

      - name: Restart workloads with latest config
        run: |
          kubectl -n smartmall rollout restart deployment/mysql deployment/backend deployment/frontend
          kubectl -n smartmall rollout status deployment/mysql --timeout=180s
          kubectl -n smartmall rollout status deployment/backend --timeout=180s
          kubectl -n smartmall rollout status deployment/frontend --timeout=180s
